services:
  app:
    build:
      context: .
      # Enable BuildKit for faster builds with cache mounting
      # Set DOCKER_BUILDKIT=1 in your environment or use: docker compose build --build-arg BUILDKIT_INLINE_CACHE=1
    image: huynguyen287/elios-ai-service:latest
    container_name: elios-ai-service
    ports:
      - "8010:8010"
    environment:
      ENVIRONMENT: development
      DEBUG: true
      API_HOST: 0.0.0.0
      API_PORT: 8010
      API_PREFIX: /api
      DATABASE_URL: "postgresql://neondb_owner:npg_nKoh8mjGQ9gS@ep-bold-snow-a1y91g0b.ap-southeast-1.aws.neon.tech/AIService?sslmode=require&channel_binding=require"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

