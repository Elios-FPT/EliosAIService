[project]
name = "elios-ai-service"
version = "0.1.0"
description = "AI-powered mock interview platform with CV analysis and real-time feedback"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Elios Team"},
]
keywords = ["ai", "interview", "nlp", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Framework
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",

    # LLM Providers
    "openai>=2.6.0",
    "anthropic>=0.72.0",

    # Vector Databases
    "pinecone>=8.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.17.0",

    # NLP & Document Processing
    "spacy>=3.7.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langsmith>=0.4.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",

    # Vector Databases (additional)
    "chromadb>=1.3.0",
    "numpy>=1.24.0",

    # Speech Services
    "google-cloud-speech>=2.33.0",
    "google-cloud-texttospeech>=2.19.0",
    "azure-cognitiveservices-speech>=1.47.0",  # TODO: Remove after 2026-01-01 (30-day rollback)

    # Utilities
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "colorlog>=6.10.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "deepdiff>=6.7.0",

    # Background Jobs
    "apscheduler>=3.10.0",

    # Messaging
    "aiokafka>=0.10.0",

    # WebSocket Client (for test bot)
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",

    # Code Quality
    "ruff>=0.14.0",
    "black>=25.9.0",
    "mypy>=1.18.0",

    # Development Tools
    "ipython>=9.6.0",
]

[project.urls]
Homepage = "https://github.com/elios/elios-ai-service"
Repository = "https://github.com/elios/elios-ai-service"
Documentation = "https://github.com/elios/elios-ai-service#readme"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
  # Enable stricter checks
  disallow_untyped_defs = true
  disallow_incomplete_defs = true
  strict = true
  warn_return_any = true
  warn_unused_configs = true
  check_untyped_defs = true
  no_implicit_optional = true
  warn_redundant_casts = true
  warn_unused_ignores = true
  warn_no_return = true
  strict_equality = true
  ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
